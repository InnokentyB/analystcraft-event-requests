name: Verify and publish event requests image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: event-requests-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and verify the actual container
        run: |
          docker build -t analystcraft-events-smoke .
          docker run -d --name analystcraft-events-smoke --memory=256m --cpus=0.5 -p 127.0.0.1:18082:8080 analystcraft-events-smoke
          trap 'docker rm -f analystcraft-events-smoke' EXIT
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:18082/health
          E2E_BASE_URL=http://127.0.0.1:18082 npm run test:e2e
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable revision
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/innokentyb/analystcraft-event-requests:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Save digest receipt
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf '%s\n' "ghcr.io/innokentyb/analystcraft-event-requests@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
